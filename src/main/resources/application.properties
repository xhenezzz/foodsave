spring.application.name=FoodSave
spring.config.import=optional:file:./.env[.properties]
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodsave_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

foodsave.ai.api-key=${GEMINI_API_KEY:}
foodsave.ai.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

foodsave.uploads.path=${FOODSAVE_UPLOADS_PATH:./uploads/foodsave}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

foodsave.payments.demo-enabled=${FOODSAVE_DEMO_PAYMENTS:false}

# Stripe Embedded Checkout (test mode by default; keep secret keys in local .env)
foodsave.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
foodsave.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
foodsave.payments.stripe.currency=${STRIPE_CURRENCY:kzt}
foodsave.payments.stripe.frontend-url=${FRONTEND_URL:http://localhost:5173}

